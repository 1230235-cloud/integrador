; Puente LoRa → USB — segunda Heltec WiFi LoRa 32 V3
;
; Compilar:   pio run
; Flashear:   pio run -t upload
; Monitor:    pio device monitor -b 115200

[env:estacion]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I../comun/include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    jgromes/RadioLib@^7.2.0
