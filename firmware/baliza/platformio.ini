; Baliza de la carga secundaria — ESP32 genérico + módulo SX1262 suelto
;
; Emite cada 400 ms una trama BALIZA que la etapa primaria usa para estimar
; la distancia por RSSI. La carga secundaria NO lleva autogiro ni servo.
;
; Compilar:   pio run
; Flashear:   pio run -t upload

[env:baliza]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../comun/include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    jgromes/RadioLib@^7.2.0
